name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NATIVE_DEPS: build-essential cmake clang pkg-config libsqlite3-dev libpcre2-dev

jobs:
  boundary:
    name: Boundary
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Base install pulls no model stack
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/python -m pip install --upgrade pip
          /tmp/base/bin/python -m pip install .
          /tmp/base/bin/python - <<'EOF'
          import importlib.metadata as md, json
          installed = {d.metadata["Name"].lower() for d in md.distributions()}
          policy = json.load(open("ELPIS_SYSTEM.json"))["boundary_policy"]["forbidden_python_imports"]
          forbidden = {n.lower() for n in policy} | {"torch", "transformers", "huggingface-hub", "safetensors", "numpy"}
          assert not installed & forbidden, installed & forbidden
          import elpis, elpis.runtime, sys
          assert "torch" not in sys.modules and "numpy" not in sys.modules
          print("base install:", sorted(installed))
          EOF
      - name: Boundary suite (architecture, authority, migration record)
        run: |
          # Base neutrality was proved above before inference dependencies existed.
          # The closure probe intentionally imports every inference module, so
          # qualify it in the explicit inference environment.
          /tmp/base/bin/python -m pip install ".[inference]" pytest
          /tmp/base/bin/python -m pytest tests/boundary

  parity:
    name: Donor parity
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ELPIS_REQUIRE_DONOR: "1"
      ELPIS_DONOR_ROOT: ${{ github.workspace }}/donor
    steps:
      - uses: actions/checkout@v4
      - name: Read-only donor checkout at the migration basis
        uses: actions/checkout@v4
        with:
          repository: abraxis717/Elpis_beta
          ref: 8eda162712ebe291f2b88b6906366075859bc485
          path: donor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parity suite
        run: |
          python -m pip install ".[test]"
          python -m pytest tests/boundary/test_donor_parity.py -rs

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      ELPIS_REQUIRE_NATIVE: "1"
      ELPIS_NATIVE_BUILD: ${{ github.workspace }}/build
    steps:
      # Full history: the evidence chronology gates (Retention R0 RET0A -> RET0D, the
      # mission gate's forensic commits) read git history; a shallow clone cannot see it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_DEPS
      - name: Native build (libraries loaded by Python)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Clean install
        run: |
          python -m venv /tmp/elpis-venv
          /tmp/elpis-venv/bin/python -m pip install --upgrade pip
          /tmp/elpis-venv/bin/python -m pip install ".[test]"
      - name: Test suite
        run: /tmp/elpis-venv/bin/python -m pytest

  airgap:
    name: Python without network
    runs-on: ubuntu-latest
    env:
      ELPIS_NATIVE_BUILD: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_DEPS
      - name: Build and install (network allowed only here)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          python -m venv /tmp/elpis-venv
          /tmp/elpis-venv/bin/python -m pip install ".[test]"
      - name: Full suite in a network namespace with no interfaces up
        run: |
          run_isolated() {
            sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
              env -i PATH="$PATH" HOME="$HOME" PYTHONDONTWRITEBYTECODE=1 ELPIS_REQUIRE_NATIVE=1 \
              ELPIS_NATIVE_BUILD="$ELPIS_NATIVE_BUILD" "$@"
          }
          run_isolated /tmp/elpis-venv/bin/python -c "
          import socket
          try:
              socket.create_connection(('1.1.1.1', 443), 3)
          except OSError as exc:
              print('network unreachable as required:', exc)
          else:
              raise SystemExit('network reachable inside the isolation namespace')
          "
          run_isolated /tmp/elpis-venv/bin/python -m pytest

  authority:
    # Scientific authority gate (docs/CI_POLICY.md). Not a replacement for the full
    # suites above: a focused, declared-environment run of the evidence and
    # reproduction contracts, with the effective numerical environment printed.
    name: Scientific authority
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      ELPIS_REQUIRE_NATIVE: "1"
      ELPIS_NATIVE_BUILD: ${{ github.workspace }}/build
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_DEPS
      - name: Native build (libraries loaded by Python)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Declared environment (NumPy pinned to the version the evidence recorded)
        run: |
          python -m venv /tmp/elpis-venv
          /tmp/elpis-venv/bin/python -m pip install --upgrade pip
          /tmp/elpis-venv/bin/python -m pip install ".[test]" "numpy==1.26.4"
      - name: Effective numerical environment
        run: |
          /tmp/elpis-venv/bin/python - <<'EOF'
          import platform
          import numpy
          from tests.research._blas import openblas_core, openblas_threads
          print("python", platform.python_version(), "| numpy", numpy.__version__, "| machine", platform.machine())
          print("OpenBLAS core", openblas_core(), "| effective threads", openblas_threads())
          EOF
          grep -m1 "model name" /proc/cpuinfo
          grep -m1 -E "^model[[:space:]]" /proc/cpuinfo
          echo "shallow: $(git rev-parse --is-shallow-repository)"
      - name: Current executor equals the scalar reference (native, AVX2 and baseline clones)
        run: ctest --test-dir build --output-on-failure -R "^ECS_G\."
      - name: Evidence integrity, chronology, replay contracts, current-runtime regressions
        run: >-
          /tmp/elpis-venv/bin/python -m pytest -rs
          tests/research/ecs_cognition_r0
          tests/research/ecs_retention_r0
          tests/research/ecs_runtime_r1
          tests/ECS_G
          tests/boundary/test_cognition_r0.py
          tests/boundary/test_runtime_r1.py
          tests/boundary/test_mission.py

  native:
    name: Native (${{ matrix.compiler }}, ${{ matrix.build }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_DEPS
      - name: Configure (warnings are errors)
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CC=clang CXX=clang++; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DELPIS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Native ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan+UBSan
            flags: -DELPIS_ENABLE_ASAN=ON -DELPIS_ENABLE_UBSAN=ON
          - name: TSan
            flags: -DELPIS_ENABLE_TSAN=ON
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y $NATIVE_DEPS
      - name: Sanitizer-compatible address layout
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure (gcc, Debug, warnings are errors)
        run: CC=gcc CXX=g++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DELPIS_WARNINGS_AS_ERRORS=ON ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 1800
