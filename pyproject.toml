[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Development identity. The public distribution identity of the beta line is
# deliberately NOT claimed here; release/PyPI authority is deferred until the
# foundation is coherent (see ELPIS_SYSTEM.json and docs/MIGRATION.md).
name = "elpis-dev"
version = "0.1.0.dev0"
description = "Elpis development foundation: persistent ECS state, structural memory, controlled evolution and inference over structured state"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
classifiers = ["Private :: Do Not Upload"]
# Base installation is model- and numerics-neutral. NumPy is an explicit
# inference extra; the test extra includes it because the full suite exercises
# inference.
dependencies = []

[project.optional-dependencies]
inference = ["numpy>=1.26,<2"]
test = ["pytest>=8", "numpy>=1.26,<2"]

[project.urls]
Repository = "https://github.com/abraxis717/Elpis_DEV"

[tool.setuptools.packages.find]
where = ["src"]
include = ["elpis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
