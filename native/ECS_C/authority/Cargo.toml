[package]
name = "elpis_ecs_c_authority"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Elpis ECS_C authority: the bounded, authenticated, semantically replayed continuity and entity authority (fixed two-slot records and a protected rollback witness) behind a stable C ABI."
license = "UNLICENSED"
publish = false

# One dependency: the volatile session crate, which owns the transition law, SHA-256 and the evolution authority and
# its v2 digest (docs/ECS_C_SESSION.md), embedded without its C ABI. The reader of a continuity v2/v3 register (for an
# explicit legacy import) stays here, with the durable store this crate retires with.
[dependencies]
elpis_ecs_c_session = { path = "../session", default-features = false }

[lib]
name = "elpis_ecs_c_authority"
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["c-abi"]
# The C ABI (include/elpis/ecs_c_authority.h). A crate that embeds this one (RuntimeCore) disables it, so its own
# shared library never re-exports elpis_ecs_c_* beside libelpis_ecs_c_authority.so.
c-abi = []
# Test-only fault injection and I/O counters, compiled into libelpis_ecs_c_authority_testing.so only.
testing = []

[profile.release]
panic = "abort"
debug = false
