[package]
name = "elpis_runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Elpis RuntimeCore: runtime lifecycle, fail-stop, K1 lineage binding, managed K1 turns and evolution reservation over the continuity authority, behind a stable C ABI."
license = "UNLICENSED"
publish = false

# The durable authority is embedded as Rust crates (one implementation each, no second store): standalone continuity
# (the ABI v5 path) and the ECS_C authority (ABI v6), the latter without its C ABI (RuntimeCore never re-exports it).
[dependencies]
elpis_continuity = { path = "../continuity" }
elpis_ecs_c_authority = { path = "../ECS_C/authority", default-features = false }

[lib]
name = "elpis_runtime"
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
# Test-only authority fault injection and I/O counters, compiled into libelpis_runtime_testing.so only.
testing = ["elpis_continuity/testing", "elpis_ecs_c_authority/testing"]

[profile.release]
panic = "abort"
debug = false
