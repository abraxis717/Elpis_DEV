[package]
name = "elpis_runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Elpis RuntimeCore: runtime lifecycle, fail-stop, K1 lineage binding, managed K1 turns and evolution reservation over a volatile ECS_C session, behind a stable C ABI. No persistent-state write path."
license = "UNLICENSED"
publish = false

# The authority is embedded as a Rust crate (one implementation): the volatile ECS_C session, without its C ABI
# (RuntimeCore never re-exports it). ABI v8 retired the durable ECS_C authority (docs/ELPIS_MISSION.md, Amendment 3).
[dependencies]
elpis_ecs_c_session = { path = "../ECS_C/session", default-features = false }

[lib]
name = "elpis_runtime"
crate-type = ["cdylib", "rlib"]
doctest = false

[profile.release]
panic = "abort"
debug = false
