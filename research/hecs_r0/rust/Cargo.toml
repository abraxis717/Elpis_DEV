[package]
name = "hecs_r0"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "H-ECS R0: hierarchical ECS world models (RESEARCH_ONLY laboratory)."
license = "UNLICENSED"
publish = false

# No dependencies: the standard library only. The ECS is the native K1 library, loaded by explicit path.
[dependencies]

[lib]
name = "hecs_r0"
path = "src/lib.rs"
doctest = false  # doc comments carry formulas, not examples

[[bin]]
name = "hecs"
path = "src/main.rs"

[profile.release]
debug = false
